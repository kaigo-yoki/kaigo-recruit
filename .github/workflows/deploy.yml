name: Deploy Recruit Site to Xserver

# mainブランチにプッシュされた時に実行
on:
  push:
    branches:
      - main
  # 転送が失敗したときに、Actionsの画面から手動でやり直せるようにする
  workflow_dispatch:

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      # リポジトリのコードをチェックアウト
      - name: Checkout code
        uses: actions/checkout@v4

      # FTPでXサーバーにアップロード
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /
          protocol: ftps
          # Xサーバーへの接続が混み合うと既定の30秒では間に合わず
          # 「Timeout (control socket)」で転送そのものが始まらないことがある。
          # 実際、直近144回のうち5回がこれで失敗している。2分まで待つ。
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
